server:
  port: ${PORT:8080}
  shutdown: graceful

spring:
  application:
    name: dollar-api-java
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 1000ms
      lettuce:
        shutdown-timeout: 100ms

dollar:
  upstream:
    url: ${UPSTREAM_URL:https://dolarapi.com/v1/dolares}
    connect-timeout-ms: 2000
    read-timeout-ms: 2000
  cache:
    ttl-seconds: ${CACHE_TTL_SECONDS:300}

# Resilience4j Configuration
resilience4j:
  circuitbreaker:
    instances:
      dollarApi:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 6
        minimumNumberOfCalls: 3
        failureRateThreshold: 50.0
        waitDurationInOpenState: 5000ms
        permittedNumberOfCallsInHalfOpenState: 2
        automaticTransitionFromOpenToHalfOpenEnabled: true
        slowCallRateThreshold: 100.0
        slowCallDurationThreshold: 2000ms
        recordExceptions:
          - com.dollarapi.exception.UpstreamServiceException
          - org.springframework.web.client.RestClientException
          - java.io.IOException
          - java.util.concurrent.TimeoutException

  retry:
    instances:
      dollarApi:
        maxAttempts: 3
        waitDuration: 200ms
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2
        retryExceptions:
          - com.dollarapi.exception.UpstreamServiceException
          - org.springframework.web.client.RestClientException
          - java.io.IOException

  timelimiter:
    instances:
      dollarApi:
        timeoutDuration: 2000ms
        cancelRunningFuture: true

# Springdoc OpenAPI & Swagger UI
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
    displayRequestDuration: true

# Spring Boot Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,circuitbreakers,circuitbreakerevents,retries
  endpoint:
    health:
      show-details: always
  health:
    circuitbreakers:
      enabled: true
    redis:
      enabled: false # Handled via graceful cache service to avoid marking app unhealthy when Redis down

logging:
  level:
    root: INFO
    com.dollarapi: INFO
    io.github.resilience4j: INFO
